name = "yorktown-george"
main = "src/index.js"
compatibility_date = "2026-11-01"

# Plain settings. Secrets (XAI_API_KEY, RESEND_API_KEY) are NOT put here.
# Set those with: npx wrangler secret put XAI_API_KEY

[vars]
XAI_MODEL = "grok-4.3"
# Match percent, tax, fees, and the margin floor live in worker/config/rules.js.
# This var is not used for pricing.
MAX_OUTPUT_TOKENS = "650"
MAX_HISTORY_MESSAGES = "8"
MAX_USER_TURNS = "12"
MAX_SEARCHES_PER_CHAT = "2"
MAX_SEARCHES_PER_IP_DAY = "15"
RATE_LIMIT_CHAT_PER_HOUR = "20"
RATE_LIMIT_CHAT_PER_DAY = "60"
RATE_LIMIT_QUOTE_PER_DAY = "8"
ALLOWED_ORIGINS = "https://yorktowntools.com,https://www.yorktowntools.com,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8765,http://127.0.0.1:8765"
FROM_EMAIL = "Yorktown Tools <quotes@quotes.yorktowntools.com>"
SALES_EMAIL = "sales@yorktowntools.com"
FORMSPREE_URL = "https://formspree.io/f/xanlvyan"
MOCK_MODE = "false"
